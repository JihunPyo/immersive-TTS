[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "immersive-tts"
version = "0.1.0"
description = "등장인물마다 다른 목소리로 읽어주는 TTS"
requires-python = ">=3.11"

[project.scripts]
immersive-tts = "immersive_tts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
